name: Feature request
description: Suggest something katra should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Please read [`docs/katra-spec.md`](https://github.com/itsacoyote/katra/blob/main/docs/katra-spec.md) first.**
        §2 lists ideas that were **considered and declined** (time tracking, comment threads,
        a GraphQL query engine, and others) and §2 also lists what's deliberately deferred.
        If your idea is there, make the case for why the reasoning should change.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that katra makes hard or impossible? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
      description: If you have a shape in mind, sketch the command or output.
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      description: katra's core guarantees. Confirm your idea is compatible.
      options:
        - label: This works with zero providers installed and no network
          required: false
        - label: This does not require katra to write to an external tracker
          required: false
        - label: This does not require a daemon or background process
          required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
