name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; the runner's
      # bundled npm lags node releases, so pin to latest explicitly.
      - run: npm install -g npm@latest

      # Opens/updates a "Version Packages" PR when changesets are pending,
      # and publishes to npm when that PR is merged. Publishing authenticates
      # via OIDC (id-token: write above + the trusted publisher configured on
      # npmjs.com for this repo and workflow) — no NPM_TOKEN secret.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
